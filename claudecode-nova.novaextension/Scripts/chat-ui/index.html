<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Claude Code · Nova chat (M2 demo)</title>
  <link rel="stylesheet" href="chat.css" />
  <!-- highlight.js — auto-pick atom-one-dark vs atom-one-light depending
       on the macOS / Nova Preview color scheme. Both stylesheets load
       but only the matching media query applies. -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/atom-one-dark.min.css"
        media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/atom-one-light.min.css"
        media="(prefers-color-scheme: light)" />
  <script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"></script>
  <!-- marked for markdown rendering -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
  <!-- xterm.js for the embedded terminal panel (Mode A CLI inline) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__title">
      <span class="topbar__brand">Claude Code · Nova</span>
      <span class="topbar__sub">M2 chat UI demo</span>
    </div>
    <div class="topbar__layout" role="group" aria-label="Panel layout">
      <button id="layout-chat" class="layout-btn active" title="Chat only">Chat</button>
      <button id="layout-cli" class="layout-btn" title="Terminal only">CLI</button>
      <button id="layout-both" class="layout-btn" title="CLI above chat">Both</button>
    </div>
    <div class="topbar__status" id="status">
      <span class="dot dot--idle" id="status-dot"></span>
      <span id="status-text">Connecting…</span>
    </div>
  </header>

  <div class="panels" id="panels">
    <div class="chat-panel" id="chat-panel">
      <main class="chat" id="chat">
        <div class="chat__empty" id="empty-state">
          <div class="chat__empty-title">Try something like :</div>
          <ul class="chat__empty-list">
            <li><button class="suggestion" data-prompt="List the files in the workspace and tell me what this project does.">List the files in the workspace and tell me what this project does.</button></li>
            <li><button class="suggestion" data-prompt="Read src/auth.ts and identify any security issues.">Read src/auth.ts and identify any security issues.</button></li>
            <li><button class="suggestion" data-prompt="Get the diagnostics for src/auth.ts.">Get the diagnostics for src/auth.ts.</button></li>
          </ul>
        </div>
      </main>

      <button id="jump-latest" class="jump-latest" hidden title="Jump to the latest message">↓ Latest</button>

      <footer class="composer">
        <div class="composer__meta" id="meta">
          <label class="composer__model" title="Model used for the next message (no restart needed)">
            <span class="composer__model-label">Model</span>
            <select id="model-picker">
              <option value="claude-sonnet-4-6">Sonnet 4.6</option>
              <option value="claude-haiku-4-5">Haiku 4.5</option>
              <option value="claude-opus-4-7">Opus 4.7</option>
              <option value="claude-opus-4-8">Opus 4.8 (1M)</option>
            </select>
          </label>
          <span id="meta-mode" class="meta-mode" hidden></span>
          <span class="composer__status" id="composer-status" title="Claude activity">
            <span class="dot dot--idle" id="composer-status-dot"></span>
            <span id="composer-status-text">Ready</span>
          </span>
          <button id="export-md" class="meta-btn" title="Export this conversation as a Markdown file">⤓ Export</button>
          <button id="remote-control" class="meta-btn" title="List claude sessions running on this machine and resume one in the chat">⇄ Live</button>
          <button id="resume" class="meta-btn" title="Resume a previous session">⏱ Resume…</button>
        </div>
        <div id="attachments" class="attachments" hidden></div>
        <div class="composer__row">
          <div class="composer__input-wrap">
            <div id="slash-menu" class="slash-menu" hidden></div>
            <div id="resume-menu" class="resume-menu" hidden></div>
            <div id="drop-overlay" class="drop-overlay" hidden>
              <div class="drop-overlay__msg">Drop images here</div>
            </div>
            <textarea
              id="input"
              placeholder="Ask Claude… (type / for commands · drop or paste images · Enter to send)"
              rows="1"
              autofocus
            ></textarea>
          </div>
          <button id="send" class="btn btn--primary" title="Send (Enter)">Send</button>
          <button id="abort" class="btn btn--secondary" title="Abort current query" hidden>Stop</button>
        </div>
        <div class="composer__costline">
          <span id="meta-session"></span>
          <span class="costline__info">
            <span id="meta-cost"></span>
          </span>
          <span id="meta-ctx" class="ctx-meter" role="button" tabindex="0" title="Context window — click to compact (fills after the first reply)">
            <svg class="ctx-ring" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
              <circle class="ctx-ring__track" cx="10" cy="10" r="8"></circle>
              <circle class="ctx-ring__fill" cx="10" cy="10" r="8"></circle>
            </svg>
            <span class="ctx-meter__label">ctx</span>
          </span>
          <label class="composer__toggle" title="Prepend your current file + selection to every prompt">
            <input type="checkbox" id="inject-context" checked />
            <span>Auto-inject context</span>
          </label>
        </div>
      </footer>
    </div>

    <div class="splitter" id="splitter" role="separator" aria-orientation="horizontal" title="Drag to resize" hidden></div>

    <section class="terminal" id="terminal-panel" hidden>
      <div class="terminal__header">
        <span class="terminal__title">Claude Code CLI</span>
        <span class="terminal__hint">type <code>claude</code> prompts directly · Ctrl+C to interrupt</span>
        <button id="term-live" class="term-action" title="Attach a running local claude session in this terminal">⇄ Live</button>
        <button id="term-resume" class="term-action" title="Resume a previous claude session in the terminal">⏱ Resume</button>
        <button id="term-restart" class="term-action" title="Restart the claude session (spawns a fresh PTY)">↻ Restart</button>
        <div id="term-resume-menu" class="term-resume-menu" hidden></div>
      </div>
      <div id="terminal-host" class="terminal__host"></div>
    </section>
  </div>

  <div class="statusbar" id="statusbar">
    <span class="statusbar__item" title="Claude Code Bridge MCP server status">
      <span class="dot dot--idle" id="bridge-dot"></span>
      <span id="bridge-text">Bridge: connecting…</span>
    </span>
    <span class="statusbar__spacer"></span>
    <span class="statusbar__item statusbar__item--right" title="Chat UI server status">
      <span class="dot dot--idle" id="chat-dot"></span>
      <span id="chat-status-text">Chat: connecting…</span>
    </span>
  </div>

  <script type="module" src="chat.js"></script>
</body>
</html>
